name: Fix GitHub Pages login redirect path

on:
  push:
    paths:
      - '.github/workflows/fix-github-pages-login-path.yml'

permissions:
  contents: write

jobs:
  fix-login-path:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix absolute login redirects for GitHub Pages
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('web/js/app.js')
          text = path.read_text(encoding='utf-8')
          old = "window.location.href = '/login.html';"
          new = "window.location.href = 'login.html';"
          count = text.count(old)
          if count == 0:
              print('No absolute /login.html redirects found; nothing to change.')
          else:
              path.write_text(text.replace(old, new), encoding='utf-8')
              print(f'Replaced {count} redirect(s).')
          PY

      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/js/app.js
          git commit -m "Fix login redirects for GitHub Pages"
          git push
