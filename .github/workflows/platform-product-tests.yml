name: Platform product regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and verify
        run: |
          mkdir -p bin
          find src -name '*.java' -print > /tmp/platform-sources.txt
          javac -encoding UTF-8 -d bin @/tmp/platform-sources.txt
          java -cp bin test.ParkingSystemTest
          java -cp bin test.PlatformRecoveryTest
          java -cp bin test.PlatformBusinessTest
          node --check web/js/platform.js
          node tests/platform-core.test.cjs
          python3 tests/test_platform.py bin
          bash -n scripts/backup-postgres.sh scripts/recover-admin.sh
      - name: Browser acceptance
        run: |
          npm install --prefix "$RUNNER_TEMP/platform-browser" --no-package-lock playwright@1.51.1
          "$RUNNER_TEMP/platform-browser/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/platform-browser/node_modules" node tests/platform-browser.cjs bin
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: parking_ci
          POSTGRES_USER: parking_ci
          POSTGRES_PASSWORD: disposable_ci_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U parking_ci -d parking_ci"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Concurrent PostgreSQL and restore drill
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/parking_ci
          TEST_DB_USER: parking_ci
          TEST_DB_PASSWORD: disposable_ci_password
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          mkdir -p bin
          find src -name '*.java' -print > /tmp/platform-sources.txt
          javac -encoding UTF-8 -d bin @/tmp/platform-sources.txt
          curl -fsSLo /tmp/postgresql.jar https://repo.maven.apache.org/maven2/org/postgresql/postgresql/42.7.7/postgresql-42.7.7.jar
          java -cp 'bin:/tmp/postgresql.jar' test.PlatformPostgresTest
          docker exec "$PG_CONTAINER" pg_dump -U parking_ci -d parking_ci -Fc > /tmp/parking-ci.dump
          bash scripts/restore-drill.sh /tmp/parking-ci.dump
