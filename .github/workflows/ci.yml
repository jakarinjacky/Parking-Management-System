name: Verify Parking System

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile Java source
        run: |
          mkdir -p bin
          find src -name '*.java' -print > sources.txt
          javac -encoding UTF-8 -d bin @sources.txt

      - name: Run Java tests
        run: java -cp bin test.ParkingSystemTest

      - name: Check JavaScript syntax
        run: |
          node --check web/js/app.js
          node --check web/js/demo-runtime.js

      - name: Check HTML ids and event handlers
        run: |
          python - <<'PY'
          import re
          from collections import Counter
          from pathlib import Path

          html = Path('web/index.html').read_text(encoding='utf-8')
          js = Path('web/js/app.js').read_text(encoding='utf-8') + '\n' + Path('web/js/demo-runtime.js').read_text(encoding='utf-8')

          ids = re.findall(r'\bid=["\']([^"\']+)["\']', html)
          duplicates = [name for name, count in Counter(ids).items() if count > 1]
          if duplicates:
              raise SystemExit('Duplicate HTML ids: ' + ', '.join(duplicates))

          attrs = re.findall(r'\b(?:onclick|onsubmit|onchange|oninput|onkeypress)=["\']([^"\']+)["\']', html)
          called = set()
          for code in attrs:
              for name in re.findall(r'(?<!\.)\b([A-Za-z_$][\w$]*)\s*\(', code):
                  if name not in {'if', 'for', 'while', 'switch'}:
                      called.add(name)

          defined = set(re.findall(r'\bfunction\s+([A-Za-z_$][\w$]*)\s*\(', js))
          defined.update(re.findall(r'window\.([A-Za-z_$][\w$]*)\s*=\s*(?:async\s*)?function', js))
          missing = sorted(called - defined)
          if missing:
              raise SystemExit('Missing event-handler functions: ' + ', '.join(missing))

          print(f'HTML smoke check OK: {len(ids)} ids, {len(called)} event functions')
          PY
