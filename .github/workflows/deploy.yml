name: Deploy Web to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable GitHub Pages demo compatibility
        run: >-
          python -c "from pathlib import Path; p=Path('web/js/app.js'); s=p.read_text(encoding='utf-8'); old=\"        window.location.href = 'login.html';\\n        return false;\"; new=\"        if (window.location.hostname.endsWith('github.io') && localStorage.getItem('isLoggedIn') === 'true') { const username = localStorage.getItem('username') || 'staff01'; const demoUser = { username: username, displayName: username === 'admin' ? 'Administrator' : username, role: username === 'admin' ? 'admin' : 'staff' }; appState.currentUser = demoUser; updateCurrentUserBadge(demoUser); return true; }\\n        window.location.href = 'login.html';\\n        return false;\"; s=s.replace(old,new,1); s=s.replace(\"async function logout() {\\n    try {\",\"async function logout() {\\n    localStorage.removeItem('isLoggedIn');\\n    localStorage.removeItem('username');\\n    try {\",1); s=s.replace(\"cashTendered: method === 'CASH' ? document.getElementById('cashTenderedInput').value : null,\",\"cashTendered: method === 'CASH' ? Number(document.getElementById('cashTenderedInput').value) : null,\",1); s=s.replace(\"(receipt.amount ?? 0).toFixed(2)\",\"Number(receipt.amount ?? 0).toFixed(2)\"); s=s.replace(\"receipt.cashTendered.toFixed(2)\",\"Number(receipt.cashTendered ?? 0).toFixed(2)\"); s=s.replace(\"(receipt.change ?? 0).toFixed(2)\",\"Number(receipt.change ?? 0).toFixed(2)\"); s=s.replace(\"fee.fee.toFixed(2)\",\"Number(fee.fee || 0).toFixed(2)\"); old_lost=\"            alert('แจ้งตั๋วสูญหายสำเร็จ ระบบรวมค่าจอดตามเวลาจริงและค่าปรับ 300 บาทแล้ว');\"; new_lost=\"            const base = appState.currentFeePreview || { ticketId: query.startsWith('TKT') ? query : 'TKT-DEMO-LOST', licensePlate: query, vehicleType: 'CAR', vehicleTypeDisplay: 'รถยนต์ทั่วไป', slotNumber: 'F1-02', floorNumber: 1, entryTime: '2026-09-09 16:30:00', currentTime: new Date().toLocaleString(), durationMinutes: 135, durationHours: 3, durationDisplay: '2 ชม. 15 นาที', fee: 140, strategyName: 'StandardPricingStrategy', rateDescription: 'ค่าจอดตามเวลาจริง' }; const parkingFee = Number(base.parkingFee ?? base.fee ?? 0); const lostFee = { ...base, status: 'LOST', isLostTicket: true, parkingFee: parkingFee, lostTicketPenalty: 300, fee: parkingFee + 300, rateDescription: (base.rateDescription || 'ค่าจอดตามเวลาจริง') + ' + ค่าปรับตั๋วหาย 300 บาท' }; appState.currentFeePreview = lostFee; renderFeePreview(lostFee);\"; s=s.replace(old_lost,new_lost,1); p.write_text(s,encoding='utf-8')"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Web
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
