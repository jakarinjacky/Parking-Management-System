name: Deploy Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          node --check web/js/app.js
          node --check web/js/demo-runtime.js
          node --check web/js/logout-ui.js
          node --check web/js/ui-effects.js
          node --check web/js/history-export.js

      - name: Prepare presentation build
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('web/index.html')
          text = index.read_text(encoding='utf-8')

          # Fix missing closing tag around the Slot Detail modal overlay.
          marker = '    <!-- Floating AI Copilot Launcher Button -->'
          if marker in text:
              before = text.split(marker, 1)[0]
              if not before.rstrip().endswith('</div>\n    </div>'):
                  text = text.replace(marker, '    </div>\n\n' + marker, 1)

          # Load GitHub Pages runtime and the visible logout/session controls.
          app_script = '    <script src="js/app.js"></script>'
          runtime_script = '    <script src="js/demo-runtime.js"></script>'
          logout_script = '    <script src="js/logout-ui.js"></script>'
          if runtime_script not in text:
              text = text.replace(app_script, app_script + '\n' + runtime_script, 1)
          if logout_script not in text:
              anchor = runtime_script if runtime_script in text else app_script
              text = text.replace(anchor, anchor + '\n' + logout_script, 1)

          index.write_text(text, encoding='utf-8')
          PY

      - name: Verify presentation build
        run: |
          test -f web/index.html
          test -f web/login.html
          test -f web/js/app.js
          test -f web/js/demo-runtime.js
          test -f web/js/logout-ui.js
          grep -q 'js/demo-runtime.js' web/index.html
          grep -q 'js/logout-ui.js' web/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Web
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
