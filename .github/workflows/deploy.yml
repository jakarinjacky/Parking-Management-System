name: Deploy Web to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable demo authentication for GitHub Pages
        run: >-
          python -c "from pathlib import Path; p=Path('web/js/app.js'); s=p.read_text(encoding='utf-8'); old=\"        window.location.href = 'login.html';\\n        return false;\"; new=\"        if (window.location.hostname.endsWith('github.io') && localStorage.getItem('isLoggedIn') === 'true') { const username = localStorage.getItem('username') || 'staff01'; const demoUser = { username: username, displayName: username === 'admin' ? 'Administrator' : username, role: username === 'admin' ? 'admin' : 'staff' }; appState.currentUser = demoUser; updateCurrentUserBadge(demoUser); return true; }\\n        window.location.href = 'login.html';\\n        return false;\"; s=s.replace(old,new,1); s=s.replace(\"async function logout() {\\n    try {\",\"async function logout() {\\n    localStorage.removeItem('isLoggedIn');\\n    localStorage.removeItem('username');\\n    try {\",1); p.write_text(s,encoding='utf-8')"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Web
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
